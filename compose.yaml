services:
  web:
    build: .
    init: true
    command: pnpm --filter @atendente/web dev
    ports:
      - '127.0.0.1:3000:3000'
  api:
    build: .
    init: true
    command: pnpm --filter @atendente/api dev
    ports:
      - '127.0.0.1:3001:3001'
  worker:
    build: .
    init: true
    command: pnpm --filter @atendente/worker dev
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendente}
      POSTGRES_DB: ${POSTGRES_DB:-atendente_ia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
